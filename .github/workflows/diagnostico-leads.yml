# Diagnóstico de atribuição dos leads.
#
# Corre só à mão (Actions → Diagnostico de leads → Run workflow), usando o
# SUPABASE_ACCESS_TOKEN do deploy, via Management API.
#
# ATENÇÃO: este repositório é PÚBLICO e os logs do Actions também são.
# Por isso:
#   - as consultas devolvem contagens, chaves de etapa, datas e valores de
#     campanha — nunca nome, e-mail ou telefone de quem quer que seja;
#   - os nomes dos espaços saem mascarados aos 4 primeiros caracteres;
#   - NENHUM token de ingestão aparece aqui. Um token de ingestão é uma chave
#     de escrita: quem o tiver consegue injectar leads no quadro do cliente.
#     Havia três cópias do token da DBP neste ficheiro — foram removidas, e
#     esse token deve ser rodado.
#
# As consultas são fixas no ficheiro de propósito: não recebem entrada de
# fora, para isto não virar uma porta de SQL arbitrário no repositório.

name: Diagnostico de leads

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mnmcxuumgbjyylsxsadv

    steps:
      - name: Consultar
        run: |
          set -euo pipefail

          run_sql () {
            echo ""
            echo "=============================================="
            echo "$1"
            echo "=============================================="
            payload=$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$2")
            curl -sS -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" | python3 -m json.tool
          }

          # ----------------------------------------------------------------
          # A pergunta do brief: dos leads com gclid, POR QUE CAMINHO entraram?
          # 'veio_da_ui' distingue lead digitado a mao (o app grava um evento
          # 'created') de lead que entrou por webhook (nao grava).
          # ----------------------------------------------------------------
          run_sql "A) Leads COM gclid: por que caminho entraram" \
          "select left(w.name, 4) || '...' as espaco,
                  l.source,
                  exists (select 1 from lead_events e
                           where e.lead_id = l.id and e.type = 'created') as veio_da_ui,
                  l.utm_source, l.utm_medium, l.utm_campaign,
                  (l.created_at at time zone 'America/Sao_Paulo')::date::text as dia
             from leads l join workspaces w on w.id = l.workspace_id
            where l.gclid is not null and l.gclid <> ''
            order by l.created_at;"

          run_sql "B) Cobertura de atribuicao por espaco" \
          "select left(w.name, 4) || '...' as espaco,
                  count(*) as leads,
                  count(*) filter (where l.gclid is not null and l.gclid <> '')       as com_gclid,
                  count(*) filter (where l.fbclid is not null and l.fbclid <> '')     as com_fbclid,
                  count(*) filter (where l.utm_source is not null and l.utm_source <> '') as com_utm,
                  count(*) filter (where l.email is not null and l.email <> '')       as com_email,
                  count(*) filter (where l.phone is not null and l.phone <> '')       as com_telefone
             from leads l join workspaces w on w.id = l.workspace_id
            group by 1 order by 2 desc;"

          run_sql "C) Como o campo Origem esta distribuido, por espaco" \
          "select left(w.name, 4) || '...' as espaco, l.source, count(*) as quantos
             from leads l join workspaces w on w.id = l.workspace_id
            group by 1, 2 order by 1, 3 desc;"

          run_sql "D) Caminho de entrada de TODOS os leads (UI vs webhook)" \
          "select left(w.name, 4) || '...' as espaco,
                  exists (select 1 from lead_events e
                           where e.lead_id = l.id and e.type = 'created') as veio_da_ui,
                  count(*) as quantos
             from leads l join workspaces w on w.id = l.workspace_id
            group by 1, 2 order by 1, 3 desc;"

          run_sql "E) Contratos fechados: ha valor e ha gclid?" \
          "select left(w.name, 4) || '...' as espaco,
                  count(*) as ganhos,
                  count(*) filter (where l.value is not null)  as com_valor,
                  count(*) filter (where l.gclid is not null and l.gclid <> '') as com_gclid,
                  min((l.won_at at time zone 'America/Sao_Paulo')::date)::text as primeiro,
                  max((l.won_at at time zone 'America/Sao_Paulo')::date)::text as ultimo
             from leads l join workspaces w on w.id = l.workspace_id
            where l.won_at is not null
            group by 1 order by 2 desc;"
